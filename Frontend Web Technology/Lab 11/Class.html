<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Student {
        constructor(givenName, givenAge) {
          this.name = givenName;
          this.age = givenAge;
        }

        introduce() {
          document.write(
            "Hello, my name is " +
              this.name +
              ".I am " +
              this.age +
              "years old.",
          );
        }
      }

      const Student1 = new Student("Priyanshi", 18);
      const Student2 = new Student("Shreena", 19);

      Student1.introduce();
      Student2.introduce();
    </script>
  </body>
</html>
