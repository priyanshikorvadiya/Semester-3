<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="myid">Write here</h1>
    <script>
      document.addEventListener("mousedown", function (event) {
        if (event.button == 0) {
          document.getElementById("myid").innerHTML = "left clicked";
        }

        if (event.button == 2) {
          document.getElementById("myid").innerHTML = "right clicked";
        }
      });
      document.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      });
    </script>
  </body>
</html>
